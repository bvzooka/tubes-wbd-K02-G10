{{/* Pakai: {{template "pagination" .Data.Pager}} dengan Pager dari httpx.NewPager. */}}
{{define "pagination"}}
<nav class="pagination" aria-label="Halaman">
  {{if .HasPrev}}<a href="{{.PrevURL}}">&laquo; Sebelumnya</a>{{else}}<span class="disabled">&laquo; Sebelumnya</span>{{end}}
  <span class="current">Halaman {{.Page}}</span>
  {{if .HasNext}}<a href="{{.NextURL}}">Berikutnya &raquo;</a>{{else}}<span class="disabled">Berikutnya &raquo;</span>{{end}}
</nav>
{{end}}
