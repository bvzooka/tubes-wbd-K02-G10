# Tempo mode tunggal untuk pengembangan lokal. Trace disimpan di /tmp (hilang saat
# container dibuat ulang) karena image Tempo berjalan sebagai user non-root.
server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

storage:
  trace:
    backend: local
    local:
      path: /tmp/tempo/traces
    wal:
      path: /tmp/tempo/wal
