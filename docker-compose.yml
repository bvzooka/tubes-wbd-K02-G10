services:
  appdb:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dbplatform
    ports:
      - "5432:5432"
    volumes:
      - appdb_data:/var/lib/postgresql/data

  targetdb:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sampledb
    ports:
      - "5433:5432"
    volumes:
      - ./docker/targetdb/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  testdb:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5434:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 15

  # Menjalankan test Go di dalam container (berguna jika Windows memblok file .exe hasil go test).
  #   docker compose run --rm test                    -> semua test
  #   docker compose run --rm test go test -short ./... -> unit test saja
  test:
    profiles: ["tools"]
    image: golang:1.26
    working_dir: /src
    environment:
      TEST_ADMIN_URL: postgres://postgres:postgres@testdb:5432/postgres?sslmode=disable
    volumes:
      - .:/src
      - gomod:/go/pkg/mod
      - gobuild:/root/.cache/go-build
    depends_on:
      testdb:
        condition: service_healthy
    command: ["go", "test", "./..."]

  # Opsional untuk bonus MySQL: docker compose --profile mysql up -d
  targetmysql:
    profiles: ["mysql"]
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sampledb
    ports:
      - "3307:3306"
    volumes:
      - ./docker/targetmysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"]
      interval: 3s
      timeout: 3s
      retries: 30

  # Bonus observability: docker compose --profile observability up -d
  # Grafana di http://localhost:3000. Biar trace masuk, set OTEL_TRACES_EXPORTER=otlp
  # dan OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318
  otel-collector:
    profiles: ["observability"]
    image: otel/opentelemetry-collector-contrib:0.114.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./docker/observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v2.55.1
    volumes:
      - ./docker/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "9090:9090"

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:11.3.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/dbplatform.json
    volumes:
      - ./docker/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]
    ports:
      - "3000:3000"

volumes:
  appdb_data:
  gomod:
  gobuild:
