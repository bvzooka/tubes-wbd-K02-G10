services:
  appdb:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dbplatform
    ports:
      - "5432:5432"
    volumes:
      - appdb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dbplatform -h 127.0.0.1"]
      interval: 2s
      timeout: 3s
      retries: 30

  targetdb:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sampledb
    ports:
      - "5433:5432"
    volumes:
      - ./docker/targetdb/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sampledb -h 127.0.0.1"]
      interval: 2s
      timeout: 3s
      retries: 30

  testdb:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5434:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 15


  test:
    profiles: ["tools"]
    image: golang:1.26
    working_dir: /src
    environment:
      TEST_ADMIN_URL: postgres://postgres:postgres@testdb:5432/postgres?sslmode=disable
    volumes:
      - .:/src
      - gomod:/go/pkg/mod
      - gobuild:/root/.cache/go-build
    depends_on:
      testdb:
        condition: service_healthy
    command: ["go", "test", "./..."]

  # app dlm container: docker compose --profile app up --build -d server worker (make app-up)
  # APP_SECRET_KEY dan SEED_ADMIN_PASSWORD dibaca dari .env di root repo
  # dari container, koneksi ke targetdb memakai host "targetdb" port 5432
  server:
    profiles: ["app"]
    build: .
    image: dbplatform:local
    environment: &app-env
      APP_ENV: development
      APP_DATABASE_URL: postgres://postgres:postgres@appdb:5432/dbplatform?sslmode=disable
      APP_SECRET_KEY: ${APP_SECRET_KEY:?isi APP_SECRET_KEY di .env (openssl rand -base64 32)}
      SEED_ADMIN_USERNAME: ${SEED_ADMIN_USERNAME:-admin}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?isi SEED_ADMIN_PASSWORD di .env}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # isi OTEL_TRACES_EXPORTER=otlp dan OTEL_LOGS_EXPORTER=otlp di .env untuk mengirim ke profil observability
      OTEL_TRACES_EXPORTER: ${OTEL_TRACES_EXPORTER:-console}
      OTEL_LOGS_EXPORTER: ${OTEL_LOGS_EXPORTER:-none}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      # halaman React hasil build di image, kosongkan untuk memakai halaman HTML lama
      WEB_DIST_DIR: /app/web/dist
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      appdb:
        condition: service_healthy
      targetdb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: on-failure:5

  worker:
    profiles: ["app"]
    build: .
    image: dbplatform:local
    command: ["/app/worker"]
    environment:
      <<: *app-env
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
    # /metrics worker; Prometheus profil observability men-scrape-nya lewat host.docker.internal:9091
    ports:
      - "9091:9091"
    depends_on:
      server:
        condition: service_healthy
    restart: on-failure:5

  k6:
    profiles: ["loadtest"]
    image: grafana/k6:0.56.0
    command: ["run", "--summary-export=/results/summary.json", "/scripts/load.js"]
    volumes:
      - ./loadtest:/scripts:ro
      - ./loadtest/results:/results
    environment:
      BASE_URL: ${K6_BASE_URL:-http://server:8080}
      TARGET_HOST: ${K6_TARGET_HOST:-targetdb}
      TARGET_PORT: ${K6_TARGET_PORT:-5432}
      ADMIN_USERNAME: ${SEED_ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?isi SEED_ADMIN_PASSWORD di .env}
      STAGE_SECONDS: ${K6_STAGE_SECONDS:-30}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  targetmysql:
    profiles: ["mysql"]
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sampledb
    ports:
      - "3307:3306"
    volumes:
      - ./docker/targetmysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"]
      interval: 3s
      timeout: 3s
      retries: 30

  # Bonus observability: docker compose --profile observability up -d (make obs-up)
  # Grafana di http://localhost:3000. Biar trace dan log masuk, set OTEL_TRACES_EXPORTER=otlp,
  # OTEL_LOGS_EXPORTER=otlp, dan OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318 di .env
  # (server di container profil app otomatis memakai http://otel-collector:4318)
  otel-collector:
    profiles: ["observability"]
    image: otel/opentelemetry-collector-contrib:0.114.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./docker/observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on: [tempo, loki]

  # penyimpanan trace
  tempo:
    profiles: ["observability"]
    image: grafana/tempo:2.6.1
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./docker/observability/tempo.yaml:/etc/tempo.yaml:ro

  # penyimpanan log, menerima OTLP langsung dari collector
  loki:
    profiles: ["observability"]
    image: grafana/loki:3.3.2
    command: ["-config.file=/etc/loki/local-config.yaml"]

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v2.55.1
    volumes:
      - ./docker/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "9090:9090"

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:11.3.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_VIEWERS_CAN_EDIT: "true" # supaya viewer bisa membuka Explore (log ke trace)
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/dbplatform.json
    volumes:
      - ./docker/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus, tempo, loki]
    ports:
      - "3000:3000"

volumes:
  appdb_data:
  gomod:
  gobuild:
