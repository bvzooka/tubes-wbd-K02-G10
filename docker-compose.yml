services:
  appdb:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dbplatform
    ports:
      - "5432:5432"
    volumes:
      - appdb_data:/var/lib/postgresql/data

  targetdb:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sampledb
    ports:
      - "5433:5432"
    volumes:
      - ./docker/targetdb/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  testdb:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5434:5432"
    tmpfs:
      - /var/lib/postgresql/data

  # Opsional untuk bonus MySQL: docker compose --profile mysql up -d
  targetmysql:
    profiles: ["mysql"]
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sampledb
    ports:
      - "3307:3306"

volumes:
  appdb_data:
